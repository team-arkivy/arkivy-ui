<div class="signup-bg">
  <!-- Canvas de ondas animadas -->
  <canvas #waveCanvas class="wave-canvas"></canvas>

  <!-- Orbs de ambiente -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Card de registro -->
  <div class="signup-card" [class.shake]="shakeCard">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-shield" aria-hidden="true">
        <svg viewBox="-9 2 108 114" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="suLG" x1="-5" y1="58" x2="92" y2="58" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#6B21E8"/>
              <stop offset="42%"  stop-color="#7C3AED"/>
              <stop offset="78%"  stop-color="#0EA5C8"/>
              <stop offset="100%" stop-color="#22D4CC"/>
            </linearGradient>
            <linearGradient id="suLS" x1="10" y1="6" x2="90" y2="114" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#9B45F5"/>
              <stop offset="48%"  stop-color="#A78BFA"/>
              <stop offset="100%" stop-color="#5EEAD4"/>
            </linearGradient>
            <filter id="suGlow" x="-22%" y="-18%" width="144%" height="136%">
              <feGaussianBlur stdDeviation="2.2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <path id="suShield" d="M50 6 L10 24 V60 C10 86 28 104 50 114 C72 104 90 86 90 60 V24 Z"/>
            <clipPath id="suClip"><use href="#suShield"/></clipPath>
          </defs>
          <g filter="url(#suGlow)">
            <use href="#suShield" fill="url(#suLG)" fill-opacity="0.10"/>
            <g fill="url(#suLG)" clip-path="url(#suClip)">
              <path d="M42 30 H88 l5.5 6 -5.5 6 H42 Z"/>
              <path d="M42 46 H88 l5.5 6 -5.5 6 H42 Z"/>
              <path d="M42 62 H88 l5.5 6 -5.5 6 H42 Z"/>
            </g>
            <use href="#suShield" fill="none" stroke="url(#suLS)" stroke-width="3.2"
              stroke-linejoin="round" stroke-linecap="round"/>
            <path fill-rule="evenodd" fill="url(#suLG)"
              d="M 30 18 L 50 18 L 86 104 L 71 104 L 63 68 L 12 68 L 2 104 L -9 104 Z
                 M 34 24 L 50 24 L 61 60 L 17 60 Z"/>
          </g>
        </svg>
      </div>
      <h1 class="brand-title">Start to use <span>Arkivy</span></h1>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" autocomplete="off" novalidate>

      <div class="field-group">
        <label for="username">User name or gmail</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Type your username"
            [(ngModel)]="credentials.username"
            required
            #usernameRef="ngModel"
            [class.input-error]="usernameRef.invalid && usernameRef.touched"
          />
        </div>
        <span class="field-error" *ngIf="usernameRef.invalid && usernameRef.touched">
          Este campo es requerido
        </span>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Type your password"
            [(ngModel)]="credentials.password"
            required
            #passwordRef="ngModel"
            [class.input-error]="passwordRef.invalid && passwordRef.touched"
          />
          <button type="button" class="toggle-pw" (click)="togglePassword()" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none">
              <path *ngIf="!showPassword"
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor" stroke-width="1.5"/>
              <circle *ngIf="!showPassword" cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path *ngIf="showPassword"
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="passwordRef.invalid && passwordRef.touched">
          Este campo es requerido
        </span>
      </div>

      <div class="field-group">
        <label for="confirmPassword">Type again your password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            id="confirmPassword"
            name="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Type your password again"
            [(ngModel)]="credentials.confirmPassword"
            required
            #confirmRef="ngModel"
            [class.input-error]="confirmRef.invalid && confirmRef.touched"
          />
          <button type="button" class="toggle-pw" (click)="toggleConfirmPassword()" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none">
              <path *ngIf="!showConfirmPassword"
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor" stroke-width="1.5"/>
              <circle *ngIf="!showConfirmPassword" cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path *ngIf="showConfirmPassword"
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="confirmRef.invalid && confirmRef.touched">
          Este campo es requerido
        </span>
      </div>

      <button
        type="submit"
        class="btn-signup"
        [class.loading]="isLoading"
        [disabled]="isLoading"
      >
        <span class="btn-text" *ngIf="!isLoading">SING UP</span>
        <span class="btn-loader" *ngIf="isLoading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        <div class="btn-glow"></div>
      </button>

      <p class="error-msg" *ngIf="registerError">{{ registerError }}</p>

      <p class="terms-text">
        Al iniciar sesión, acepta los
        <a href="#">Términos de uso</a> y reconoce la
        <a href="#">Declaración de privacidad</a> y la
        <a href="#">Política de cookies</a>.
      </p>

    </form>

    <!-- Link a login -->
    <p class="signin-text">
      Don't have an account yet?
      <a routerLink="/login" class="signin-link">sign up</a>
    </p>

    <!-- Divider -->
    <div class="divider">
      <span></span>
      <em>Or</em>
      <span></span>
    </div>

    <!-- OAuth -->
    <div class="oauth-row">
      <button type="button" class="oauth-btn oauth-google" (click)="registerWithGoogle()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Google</span>
      </button>
    </div>

  </div>
</div>
