<div class="login-bg">
    <!-- Animated network canvas background -->
    <canvas #networkCanvas class="network-canvas"></canvas>
  
    <!-- Glowing orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>


    <!-- Login Card -->
    <div class="login-card" [class.shake]="shakeCard">
  
      <!-- Logo: escudo + A + tres barras - replica exacta de la imagen -->
      <div class="logo-wrap">
        <div class="logo-shield" aria-hidden="true">
          <img src="icons/arkivy-logo.svg" alt="Arkivy logo"/>
        </div>
        <h1 class="brand-title">Sign in into <span>Arkivy</span></h1>
      </div>
  
      <!-- Form -->
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off" novalidate>
  
        <div class="field-group">
          <label for="username">User name or gmail</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Type your username"
              [(ngModel)]="credentials.username"
              required
              #usernameRef="ngModel"
              [class.input-error]="usernameRef.invalid && usernameRef.touched"
            />
          </div>
          <span class="field-error" *ngIf="usernameRef.invalid && usernameRef.touched">
            Este campo es requerido
          </span>
        </div>
  
        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Type your password"
              [(ngModel)]="credentials.password"
              required
              #passwordRef="ngModel"
              [class.input-error]="passwordRef.invalid && passwordRef.touched"
            />
            <button type="button" class="toggle-pw" (click)="togglePassword()" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="none">
                <path *ngIf="!showPassword"
                  d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                  stroke="currentColor" stroke-width="1.5"/>
                <circle *ngIf="!showPassword" cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                <path *ngIf="showPassword"
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="passwordRef.invalid && passwordRef.touched">
            Este campo es requerido
          </span>
        </div>
  
        <div class="forgot-row">
          <a href="#" class="forgot-link" (click)="onForgotPassword($event)">Forgot password?</a>
        </div>
  
        <button
          type="submit"
          class="btn-login"
          [class.loading]="isLoading"
          [disabled]="isLoading"
        >
          <span class="btn-text" *ngIf="!isLoading">LOGIN</span>
          <span class="btn-loader" *ngIf="isLoading">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </span>
          <div class="btn-glow"></div>
        </button>
  
        <p class="error-msg" *ngIf="loginError">{{ loginError }}</p>
  
        <p class="terms-text">
          Al iniciar sesión, acepta los
          <a href="#">Términos de uso</a> y reconoce la
          <a href="#">Declaración de privacidad</a> y la
          <a href="#">Política de cookies</a>.
        </p>
  
      </form>
  
      <!-- Sign up link -->
      <p class="signup-text">
        Don't have an account yet?
        <a routerLink="/register" class="signup-link">sign up</a>
      </p>
  
      <!-- Divider -->
      <div class="divider">
        <span></span>
        <em>Or</em>
        <span></span>
      </div>
  
      <!-- OAuth Buttons -->
      <div class="oauth-row">
        <button type="button" class="oauth-btn oauth-google" (click)="loginWithGoogle()">
          <img src="icons/google-logo.svg" alt="Google"/>
          <span>Google</span>
        </button>
        <button type="button" class="oauth-btn oauth-github" (click)="loginWithGitHub()">
          <img src="icons/github-logo.svg" alt="GitHub"/>
          <span>GitHub</span>
        </button>
      </div>

      <!-- Solo visible con environment.devAuthBypass=true; además requiere DEV_AUTH_BYPASS=true en el backend -->
      <button
        *ngIf="devAuthBypass"
        type="button"
        class="dev-login-btn"
        [disabled]="isLoading"
        (click)="loginAsDev()"
      >
        ⚠ Modo desarrollo (sin Zitadel)
      </button>

    </div>
  </div>
